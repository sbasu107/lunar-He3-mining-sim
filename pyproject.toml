[project]
name = "lunar-h3-mining-sim"
version = "0.1.0"
description = "Discrete-event simulation of a lunar Helium-3 mining operation"
requires-python = ">=3.10"

[project.scripts]
lunar-sim = "main:main"

# ---------------------------------------------------------------------------
# Static analysis tools (optional dev dependencies; install with pip install ruff mypy)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "RUF", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
